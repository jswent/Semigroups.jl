name: Diagnose native CI failure
on:
  push:
    branches: [codex/ci-cause-proof]
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      JULIA_PKG_PRECOMPILE_AUTO: '0'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10.13'
      - name: Pin the failing run's dependencies
        run: |
          julia --startup-file=no --project=. -e '
            using Pkg
            Pkg.add([
              PackageSpec(name="AbstractAlgebra", version="0.50.4"),
              PackageSpec(name="CxxWrap", version="0.17.5"),
              PackageSpec(name="libcxxwrap_julia_jll", version="0.14.12"),
              PackageSpec(name="libsemigroups_jll", version="3.6.1"),
              PackageSpec(name="libsemigroups_julia_jll", version="0.1.3"),
            ])
            using libsemigroups_jll
            write("/tmp/sg-core-path", libsemigroups_jll.artifact_dir)
            Pkg.status(; mode=PKGMODE_MANIFEST)
          '
      - name: Build and load the unchanged main sources
        run: julia --startup-file=no --project=. -e 'using Semigroups; Semigroups.versioninfo()'
      - name: Run bounded causal probes
        run: python3 scripts/diagnose-native-ci.py
